name: Keep scheduled checks alive

# GitHub pauses scheduled workflows after 60 days with no repo activity.
# This makes a tiny commit on the 1st of each month so the watcher never stops.
on:
  schedule:
    - cron: "17 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "park-watcher"
          git config user.email "park-watcher@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" || true
          git push
